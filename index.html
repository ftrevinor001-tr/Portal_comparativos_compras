<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comparativos de Compra</title>
<meta name="description" content="Comparativos de precios por clave entre proveedores, proveedor aprobado vigente e historial.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior con pestañas + área de trabajo amplia; tablas densas tipo hoja de cálculo para capturar precios. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eaeef2; --line:#d5dce3; --line-2:#bcc6d0;
  --fg:#18222c; --muted:#5b6876; --faint:#8794a1;
  --accent:#1d5d8f; --accent-fg:#ffffff; --accent-soft:#dde9f3;
  --ok:#1f7a4a; --ok-soft:#dcf0e4; --warn:#9a6200; --warn-soft:#fbefd5; --bad:#b3261e; --bad-soft:#f8dedb; --info-soft:#e4e8f6; --info:#3949a3;
  --best:#e3f3e8;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:6px; --shadow:0 1px 2px rgba(20,35,50,.06),0 4px 16px rgba(20,35,50,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11171d; --surface:#18212a; --surface-2:#202b36; --line:#2c3a47; --line-2:#3c4c5b;
  --fg:#e3e9ef; --muted:#9aa8b6; --faint:#6f7e8c;
  --accent:#6aa9dc; --accent-fg:#0b1720; --accent-soft:#1c3448;
  --ok:#5cc28a; --ok-soft:#173326; --warn:#e2a93f; --warn-soft:#3a2c10; --bad:#ef7a70; --bad-soft:#3d1c1a; --info-soft:#232a4a; --info:#9aa6ef;
  --best:#163323; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11171d; --surface:#18212a; --surface-2:#202b36; --line:#2c3a47; --line-2:#3c4c5b;
  --fg:#e3e9ef; --muted:#9aa8b6; --faint:#6f7e8c;
  --accent:#6aa9dc; --accent-fg:#0b1720; --accent-soft:#1c3448;
  --ok:#5cc28a; --ok-soft:#173326; --warn:#e2a93f; --warn-soft:#3a2c10; --bad:#ef7a70; --bad-soft:#3d1c1a; --info-soft:#232a4a; --info:#9aa6ef;
  --best:#163323; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.005em;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.74rem;color:var(--muted);font-weight:600}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:0 16px;min-height:56px}
@media (max-width:900px){.top-in{flex-wrap:wrap;gap:4px 12px;padding-top:8px}.nav{order:3;flex-basis:100%}}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;white-space:nowrap}
.brand svg{flex:none}
.nav{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav button{background:none;border:0;padding:17px 11px 15px;white-space:nowrap;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent}
.nav button:hover{color:var(--fg)}
.nav button.on{color:var(--fg);border-bottom-color:var(--accent)}
.who{display:flex;align-items:center;gap:10px;font-size:.88rem;white-space:nowrap}
.who b{font-weight:600}
.demo-bar{background:var(--warn-soft);color:var(--warn);font-size:.85rem;padding:6px 16px;border-bottom:1px solid var(--line)}

main{padding-inline:16px;padding-block:20px 60px;max-width:1500px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g2 > *, .g4 > *{min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel > h2,.panel > h3{margin-bottom:10px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:.86rem}
.kpi.attn .v{color:var(--warn)}

/* botones y campos */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 13px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=password],input[type=search],input[type=date],select,textarea{
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:7px 9px;min-width:0;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

/* tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-family:var(--f-display);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
.empty{padding:28px;text-align:center;color:var(--muted)}

.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.76rem;font-weight:600;letter-spacing:.02em;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.BORRADOR{background:var(--surface-2);color:var(--muted)}
.pill.EN.REVISION,.pill.rev{background:var(--warn-soft);color:var(--warn)}
.pill.APROBADO{background:var(--ok-soft);color:var(--ok)}
.pill.RECHAZADO,.pill.SUSPENDIDO{background:var(--bad-soft);color:var(--bad)}
.pill.ANULADO{background:var(--bad-soft);color:var(--bad)}
tr.anulada td{color:var(--faint)}
.pill.CANCELADO{background:var(--surface-2);color:var(--faint);text-decoration:line-through}
.pill.EVAL{background:var(--info-soft);color:var(--info)}
.up{color:var(--bad)} .down{color:var(--ok)}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* editor de comparativo */
.cmp-grid td,.cmp-grid th{padding:5px 7px}
.cmp-grid td input{padding:4px 6px;font-family:var(--f-mono);font-size:.88rem;text-align:right;width:84px}
.cmp-grid td input.clv{text-align:left;width:76px}
.cmp-grid td input.txt{font-family:var(--f-body);text-align:left;width:150px}
.cmp-grid td.desc{min-width:220px;max-width:300px;font-size:.86rem;line-height:1.25}
.cmp-grid td.best{background:var(--best)}
.cmp-grid .neto{display:block;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);text-align:right;margin-top:2px}
.cmp-grid th.prov{text-align:center;background:var(--accent-soft);color:var(--fg)}
.tbl-wrap.grid-scroll{overflow:auto;max-height:calc(100vh - 96px)}
.cmp-grid th{z-index:2}
.cmp-grid .fz{position:sticky;background:var(--surface);z-index:1}
.cmp-grid th.fz{z-index:4;background:var(--surface-2)}
.cmp-grid .fz-last{box-shadow:inset -2px 0 0 var(--line-2)}
.cmp-grid td.desc{min-width:200px;max-width:240px}
.cmp-grid select{padding:4px 6px;font-size:.86rem;width:170px}
th.num{font-family:var(--f-display);font-size:.8rem}
.vig{font-size:.8rem;line-height:1.2}
.vigtag{display:block;margin-top:3px;font-size:.74rem;color:var(--muted)}
.cmp-grid th.grp{border-left:2px solid var(--line-2);font-size:.82rem}
.cmp-grid th.sub{font-size:.7rem;padding:4px 6px;text-align:right}
.cmp-grid td.pc{border-left:2px solid var(--line-2)}
.cmp-grid td.pd{font-size:.82rem;background:var(--surface-2)}
.cmp-grid td.pf{font-family:var(--f-mono);font-size:.86rem}
.cmp-grid th.key{background:var(--accent);color:var(--accent-fg)}
.cmp-grid td.key{background:var(--accent-soft)}
.cmp-grid tfoot td{background:var(--surface-2);border-top:2px solid var(--line-2)}
.cmp-grid td.bloq{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.cmp-grid td.falta input{border-color:var(--warn)}
.tag-rel{font-family:var(--f-body);font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.tag-rel.comp{color:var(--ok)}
.tag-bq{font-family:var(--f-body);font-size:.7rem;font-weight:600;color:var(--bad);text-transform:uppercase;letter-spacing:.03em}
.cmp-grid td.entrega{font-weight:600;font-size:.74rem;text-align:center;border-left:2px solid var(--line-2);color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:6px 10px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip small{color:var(--muted)}
.sumbar{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.sumbar .kpi .v{font-size:1.35rem}
.approval{border-left:4px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:var(--r)}
.approval.rej{border-left-color:var(--bad);background:var(--bad-soft)}
.note{background:var(--surface-2);border-radius:var(--r);padding:10px 14px;font-size:.9rem;color:var(--muted)}

/* ficha de clave */
.ficha-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.clave-big{font-family:var(--f-mono);font-size:1.8rem;font-weight:500;line-height:1}
.vigente-card{border:2px solid var(--ok);border-radius:var(--r);padding:14px;background:var(--surface)}
.vigente-card.none{border-color:var(--line-2);border-style:dashed}
.vigente-card .p{font-family:var(--f-display);font-size:2.1rem;font-weight:600;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.spark{width:100%;height:120px;display:block}

/* login */
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .panel{padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}

/* modal y avisos */
.modal-bg{position:fixed;inset:0;background:rgba(10,18,26,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);width:100%;max-width:640px;display:flex;flex-direction:column;max-height:88vh}
.modal.wide{max-width:1000px}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mb{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 32px))}
.toast.err{background:var(--bad);color:#fff}
.err-msg{color:var(--bad);font-size:.88rem}
.loading{color:var(--muted);padding:20px}
@media (max-width:640px){ .nav button{padding:10px 8px} .who .rol{display:none} h1{font-size:1.35rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* ====================================================================
   CAPA DE DATOS
   - Con SUPABASE_URL en config.js usa Supabase (datos compartidos).
   - Sin configuración arranca en MODO DEMOSTRACIÓN (datos de ejemplo
     guardados solo en este navegador).
   ==================================================================== */
const CFG = window.APP_CONFIG || {};
const DEMO = !CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY;

function netoDe(precio, descuentos, factor){
  if (precio === null || precio === undefined || precio === '' || isNaN(+precio)) return null;
  let n = +precio;
  String(descuentos || '').split(/[+,;\s]+/).forEach(d => { const x = parseFloat(d); if (!isNaN(x) && x) n *= (1 - x/100); });
  const f = parseFloat(factor); if (!isNaN(f) && f > 0) n *= f;
  return Math.round(n * 1e6) / 1e6;
}
function chunk(a, n){ const r=[]; for(let i=0;i<a.length;i+=n) r.push(a.slice(i,i+n)); return r; }
function errMsg(e){ return (e && (e.message || e.error_description || e.details)) || String(e); }

/* ---------------- SUPABASE ---------------- */
function makeSupabaseApi(){
  const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const ok = ({data, error}) => { if (error) throw new Error(error.message); return data; };
  const LIST_COLS = 'id,folio,titulo,comprador,estatus,claves,importe_actual,importe_propuesto,creado_por,creado_en,actualizado_por,actualizado_en,enviado_en,aprobado_por,aprobado_en,proveedores';
  async function all(q){ // paginación de 1000 en 1000
    let out=[], from=0;
    for(;;){ const d = ok(await q().range(from, from+999)); out = out.concat(d); if (d.length < 1000) break; from += 1000; }
    return out;
  }
  return {
    usuarios: async () => ok(await sb.from('cmp_usuarios').select('*').order('nombre')),
    verificarPin: async (id, pin) => ok(await sb.rpc('cmp_verificar_pin', {p_usuario_id:id, p_pin:pin})),
    cambiarPin: async (id, actual, nuevo) => ok(await sb.rpc('cmp_cambiar_pin', {p_usuario_id:id, p_pin_actual:actual, p_pin_nuevo:nuevo})),
    registrarAcceso: async (u) => { await sb.from('cmp_accesos').insert({usuario:u.nombre, rol:u.rol, navegador:navigator.userAgent.slice(0,180)}); },
    accesos: async () => ok(await sb.from('cmp_accesos').select('*').order('fecha',{ascending:false}).limit(500)),
    bitacora: async () => ok(await sb.from('cmp_bitacora').select('*').order('fecha',{ascending:false}).limit(500)),
    log: async (usuario, accion, entidad, entidad_id, detalle) => { try{ await sb.from('cmp_bitacora').insert({usuario, accion, entidad, entidad_id:String(entidad_id??''), detalle}); }catch(e){} },
    buscarProductos: async (q) => {
      q = q.trim(); if (!q) return [];
      let qb = sb.from('cmp_productos').select('*').limit(60);
      if (/^\d+$/.test(q)) qb = qb.or(`clave.eq.${q},descripcion.ilike.%${q}%`);
      else q.split(/\s+/).filter(Boolean).forEach(w => { qb = qb.ilike('descripcion', `%${w.replace(/[%,()]/g,'')}%`); });
      return ok(await qb.order('clave'));
    },
    productos: async (claves) => { let out=[]; for (const c of chunk([...new Set(claves)], 200)) out = out.concat(ok(await sb.from('cmp_productos').select('*').in('clave', c))); return out; },
    vigentes: async (claves) => { let out=[]; for (const c of chunk([...new Set(claves)], 200)) out = out.concat(ok(await sb.from('cmp_asignaciones').select('*').eq('vigente',true).in('clave', c))); return out; },
    asignacionesVigentes: async () => all(() => sb.from('cmp_asignaciones').select('*').eq('vigente',true).order('clave')),
    ultimasAsignaciones: async (n=15) => ok(await sb.from('cmp_asignaciones').select('*').order('aprobado_en',{ascending:false}).limit(n)),
    contarVigentes: async () => { const r = await sb.from('cmp_asignaciones').select('id',{count:'exact',head:true}).eq('vigente',true); if (r.error) throw new Error(r.error.message); return r.count||0; },
    historialClave: async (clave) => ({
      asignaciones: ok(await sb.from('cmp_asignaciones').select('*').eq('clave', clave).order('aprobado_en',{ascending:false})),
      comparativos: ok(await sb.from('cmp_comparativos').select('*').contains('claves',[clave]).order('creado_en',{ascending:false}).limit(60)),
    }),
    proveedores: async () => ok(await sb.from('cmp_proveedores').select('*').order('nombre')),
    guardarProveedor: async (p, usuario) => {
      const row = {...p}; delete row.id; delete row.estatus; delete row.creado_en; delete row.actualizado_en; delete row.estatus_por; delete row.estatus_en; delete row.estatus_motivo;
      row.nombre = String(row.nombre||'').trim().toUpperCase();
      row.actualizado_por = usuario;
      const dup = (r) => { if (r.error && /id_sistema/.test(r.error.message)) throw new Error('Ya hay otro proveedor con ese ID del sistema'); if (r.error && /duplicate|unique/i.test(r.error.message)) throw new Error('Ya existe un proveedor con ese nombre'); return ok(r); };
      if (p.id) return dup(await sb.from('cmp_proveedores').update(row).eq('id', p.id).select().single());
      row.creado_por = usuario;

/* ---------------- DEMOSTRACIÓN (localStorage) ---------------- */
function makeDemoApi(){
  const KEY = 'comparativos_demo_v4';

  try { db = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
  if (!db) db = buildDemoSeed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {} };
  save();
  const now = () => new Date().toISOString();
  const nextId = (t) => { db.seq[t] = (db.seq[t]||0) + 1; return db.seq[t]; };
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const wait = (x) => new Promise(r => setTimeout(() => r(clone(x)), 60));

  }

  const bit = (usuario, accion, entidad, entidad_id, detalle) => db.bitacora.unshift({id:nextId('bitacora'), fecha:now(), usuario, accion, entidad, entidad_id:String(entidad_id??''), detalle});

    registrarAcceso: async (u) => { db.accesos.unshift({id:nextId('accesos'), fecha:now(), usuario:u.nombre, rol:u.rol, navegador:navigator.userAgent.slice(0,180)}); save(); },
    accesos: async () => wait(db.accesos.slice(0,500)),
    bitacora: async () => wait(db.bitacora.slice(0,500)),
    log: async (usuario, accion, entidad, entidad_id, detalle) => { bit(usuario, accion, entidad, entidad_id, detalle); save(); },
    buscarProductos: async (q) => {
      q = q.trim().toUpperCase(); if (!q) return [];
      const words = q.split(/\s+/);
      return wait(db.productos.filter(p => (/^\d+$/.test(q) && String(p.clave) === q) || words.every(w => (p.descripcion||'').toUpperCase().includes(w))).slice(0,60));
    },

    vigentes: async (claves) => { const s = new Set(claves.map(Number)); return wait(db.asignaciones.filter(a => a.vigente && s.has(a.clave))); },
    asignacionesVigentes: async () => wait(db.asignaciones.filter(a => a.vigente).sort((a,b)=>a.clave-b.clave)),
    ultimasAsignaciones: async (n=15) => wait([...db.asignaciones].sort((a,b)=>b.aprobado_en.localeCompare(a.aprobado_en)).slice(0,n)),
    contarVigentes: async () => db.asignaciones.filter(a => a.vigente).length,

      let n = 0; const t = now();

      bit(u.nombre, 'APROBÓ COMPARATIVO', 'comparativo', c.folio, {claves_asignadas:n, comentario, puesto:u.puesto});
      save(); return wait({ok:true, claves_asignadas:n, aprobado_por:u.nombre});

    anular: async (id, uid, pin, motivo) => {

      let n = 0;

        const nom = String(f.proveedor || '').trim().toUpperCase();
        let p = ids !== null ? db.proveedores.find(x => x.id_sistema === ids) : null;
        if (!p && nom) { p = db.proveedores.find(x => x.nombre === nom); if (p && ids !== null && p.id_sistema == null) p.id_sistema = ids; }
        if (!p) { p = {id:nextId('proveedores'), nombre:nom || 'PROVEEDOR ' + ids, id_sistema:ids, estatus:'EN EVALUACION', creado_por:a.nombre, creado_en:now(), actualizado_por:a.nombre, actualizado_en:now(), notas:'Alta automática al cargar proveedores por clave'}; db.proveedores.push(p); }

        if (!/^\d+$/.test(String(f.clave))) continue;
        const k = +f.clave; const cur = idx.get(k) || {clave:k};
        Object.keys(f).forEach(c => { if (c !== 'clave') cur[c] = f[c]; });
        if (!idx.has(k)){ idx.set(k, cur); db.productos.push(cur); }
        if (f.comprador){ const nm = String(f.comprador).trim().toUpperCase(); if (!db.usuarios.some(u => u.nombre === nm)) db.usuarios.push({id:nextId('usuarios'), nombre:nm, rol:'COMPRADOR', activo:true, creado_en:now()}); }
        n++;
      }
      progreso && progreso(1,1); save(); return n;
    },
  };
}

/* modal: devuelve {el, close}. actions: [{label, cls, onClick(el) -> false para no cerrar}] */
function modal({title, body, actions=[], wide=false, onOpen}){
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
    <header><h2>${esc(title)}</h2><span class="spacer"></span><button class="btn ghost sm" data-x aria-label="Cerrar">✕</button></header>
    <div class="mb">${body}</div>
    ${actions.length ? `<footer>${actions.map((a,i) => `<button class="btn ${a.cls||''}" data-a="${i}">${esc(a.label)}</button>`).join('')}</footer>` : ''}
  </div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
  $('[data-x]', bg).onclick = close;
  $$('[data-a]', bg).forEach(b => b.onclick = async () => {
    const a = actions[+b.dataset.a]; if (!a.onClick) return close();
    b.disabled = true;
    try { const r = await a.onClick(bg); if (r !== false) close(); }
    catch(e) { const m = $('.err-msg', bg); if (m) m.textContent = errMsg(e); else toast(errMsg(e), true); }
    finally { b.disabled = false; }
  });
  document.body.appendChild(bg);
  const f = $('input,select,textarea', $('.mb', bg)); if (f) setTimeout(() => f.focus(), 30);
  onOpen && onOpen(bg);
  return {el:bg, close};
}
function confirmar(title, texto, label='Continuar', cls='pri'){

    $('[data-x]', m.el).addEventListener('click', () => res(false));
  });
}

function sparkline(points){ // points: [{x:Date, y:number}]
  if (points.length < 2) return '';
  const W = 520, H = 120, P = {l:52, r:12, t:12, b:22};
  const xs = points.map(p => +p.x), ys = points.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) x1 = x0 + 864e5;
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * .15 || y1 * .1 || 1; y0 -= pad; y1 += pad;
  const X = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r), Y = y => P.t + (1 - (y - y0) / (y1 - y0)) * (H - P.t - P.b);
  const d = points.map((p,i) => `${i ? 'L' : 'M'}${X(+p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = d + `L${X(xs[xs.length-1]).toFixed(1)},${H-P.b}L${X(xs[0]).toFixed(1)},${H-P.b}Z`;
  const last = points[points.length-1];
  const ticks = [y0 + (y1-y0)*.15, (y0+y1)/2, y1 - (y1-y0)*.15];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Historial de precio aprobado">
    ${ticks.map(t => `<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-6}" y="${Y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${t.toFixed(2)}</text>`).join('')}
    <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    ${points.map(p => `<circle cx="${X(+p.x)}" cy="${Y(p.y)}" r="2.5" fill="var(--accent)"/>`).join('')}
    <circle cx="${X(+last.x)}" cy="${Y(last.y)}" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <text x="${P.l}" y="${H-6}" font-size="10" fill="var(--muted)">${esc(fmtF(points[0].x))}</text>
    <text x="${W-P.r}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(fmtF(last.x))}</text>
  </svg>`;
}

  if (S.view === 'editor' && view !== 'editor' && !(await salirOk())) return;
  S.dirty = false; S.view = view;
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === (view === 'editor' ? 'comparativos' : view)));
  const main = $('#main'); main.innerHTML = '<div class="loading">Cargando…</div>';
  window.scrollTo(0, 0);
  try {
    if (view === 'inicio') await vInicio(main);
    else if (view === 'clave') await vClave(main, arg);
    else if (view === 'comparativos') await vComparativos(main);
    else if (view === 'editor') await vEditor(main, arg);
    else if (view === 'vigentes') await vVigentes(main);
    else if (view === 'proveedores') await vProveedores(main);
    else if (view === 'admin') await vAdmin(main);
    if (view !== 'editor') store.set('cmp_view', view);
  } catch(e) { main.innerHTML = `<div class="panel err-msg">No se pudo cargar: ${esc(errMsg(e))}</div>`; console.error(e); }
}

async function vInicio(main){
  const [cmps, ult, nVig] = await Promise.all([API.comparativos(), API.ultimasAsignaciones(12), API.contarVigentes()]);
  const hace30 = Date.now() - 30*864e5;
  const rev = cmps.filter(c => c.estatus === 'EN REVISION');
  const borr = cmps.filter(c => c.estatus === 'BORRADOR' || c.estatus === 'RECHAZADO');
  const apr30 = cmps.filter(c => c.estatus === 'APROBADO' && new Date(c.aprobado_en) > hace30);
  const act30 = apr30.reduce((s,c) => s + (c.importe_actual||0), 0), prop30 = apr30.reduce((s,c) => s + (c.importe_propuesto||0), 0);
  const mios = cmps.filter(c => c.comprador === S.user.nombre || c.creado_por === S.user.nombre);

  main.innerHTML = `<div class="stack">
    <div class="row"><h1>Hola, ${esc(S.user.nombre.split(' ')[0].charAt(0) + S.user.nombre.split(' ')[0].slice(1).toLowerCase())}</h1><span class="spacer"></span>

      <button class="btn pri" id="nuevo">Nuevo comparativo</button></div>
    <div class="grid g4">
      <div class="panel kpi ${rev.length ? 'attn' : ''}"><span class="v">${rev.length}</span><span class="l">En revisión, esperan aprobación</span></div>
      <div class="panel kpi"><span class="v">${borr.length}</span><span class="l">Borradores y rechazados por corregir</span></div>
      <div class="panel kpi"><span class="v">${apr30.length}</span><span class="l">Aprobados en los últimos 30 días · aumento ponderado ${act30 ? fmtPct(prop30 / act30 - 1) : '—'}</span></div>
      <div class="panel kpi"><span class="v">${nVig.toLocaleString('es-MX')}</span><span class="l">Claves con proveedor aprobado</span></div>
    </div>
    <div class="grid g2">
      <section class="stack" style="gap:8px"><h2>${isAprob() ? 'Esperan tu aprobación' : 'Mis comparativos'}</h2>${tablaComparativos(lista, isAprob() ? 'No hay comparativos esperando aprobación.' : 'Aún no tienes comparativos. Crea el primero con “Nuevo comparativo”.')}</section>

/* Tabla de proveedores con historial y bloqueos para una clave */
function tablaProvClave(clave, rels, bloqs){
  const ids = [...new Set([...rels.map(r => r.proveedor_id), ...bloqs.filter(b => b.clave != null && +b.clave === +clave).map(b => b.proveedor_id)])];
  if (!ids.length) return `<div class="tbl-wrap"><div class="empty">Sin proveedores registrados para esta clave. Se registran al cargar el archivo de proveedores por clave o al aprobar un comparativo.</div></div>`;
  const filas = ids.map(id => { const r = rels.find(x => x.proveedor_id === id) || {}; const pv = provPorId(id) || {nombre:'#' + id};
    const b = bloqs.find(x => x.proveedor_id === id && x.clave != null && +x.clave === +clave), g = bloqs.find(x => x.proveedor_id === id && x.clave == null);
    return {id, r, pv, b, g}; }).sort((a, b) => (a.r.tipo === 'COMPRADO' ? 0 : 1) - (b.r.tipo === 'COMPRADO' ? 0 : 1) || (b.r.importe || 0) - (a.r.importe || 0) || a.pv.nombre.localeCompare(b.pv.nombre));
  return `<div class="tbl-wrap"><table><thead><tr><th>Proveedor</th><th>Historial</th><th>Primera compra</th><th>Última vez</th><th class="num">Recepciones</th><th class="num">Importe</th><th class="num">Último precio</th><th>Clave proveedor</th><th>Estado</th>${isAprob() ? '<th></th>' : ''}</tr></thead><tbody>
    ${filas.map(({id, r, pv, b, g}) => `<tr><td><b>${esc(pv.nombre)}</b> ${pv.estatus && pv.estatus !== 'APROBADO' ? pill(pv.estatus) : ''}${pv.id_sistema ? `<div class="small muted mono">ID ${pv.id_sistema}</div>` : ''}</td>
      <td>${r.tipo ? `<span class="tag-rel ${r.tipo === 'COMPRADO' ? 'comp' : ''}">${r.tipo === 'COMPRADO' ? 'Comprado' : 'Solo cotizado'}</span>` : '<span class="muted small">—</span>'}</td>
      <td class="small">${fmtF(r.primera_fecha)}</td><td class="small">${fmtF(r.ultima_fecha)}</td><td class="num">${r.recepciones != null ? fmtN(r.recepciones) : '—'}</td><td class="num">${r.importe != null ? fmtImp(r.importe) : '—'}</td><td class="num">${fmt$(r.ultimo_precio)}</td><td class="mono small">${esc(r.clave_proveedor || '')}</td>
      <td class="small">${g ? `<span class="pill RECHAZADO">BLOQUEADO EN TODAS</span><div class="muted">${esc(g.motivo || '')}</div>` : b ? `<span class="pill RECHAZADO">BLOQUEADO</span><div class="muted">${esc(b.motivo || '')} · ${esc(b.bloqueado_por)}</div>` : pv.estatus === 'SUSPENDIDO' ? pill('SUSPENDIDO') : '<span class="pill APROBADO">SE COTIZA</span>'}</td>
      ${isAprob() ? `<td>${b ? `<button class="btn sm" data-desbloq="${b.id}">Desbloquear</button>` : g ? '' : `<button class="btn sm bad" data-bloqc="${id}" data-clave-b="${clave}">Bloquear</button>`}</td>` : ''}</tr>`).join('')}
  </tbody></table></div>`;
}

async function vClave(main, q){
  main.innerHTML = `<div class="stack">
    <div class="row"><h1>Consulta por clave</h1></div>
    <form id="cf" class="row"><input id="cq" type="search" placeholder="Clave (ej. 15008) o palabras de la descripción" style="max-width:460px"><button class="btn pri">Buscar</button></form>
    <div id="cres"></div></div>`;
  const buscar = async (txt) => {
    const out = $('#cres'); txt = String(txt||'').trim(); if (!txt) { out.innerHTML = `<div class="note">Escribe una clave para ver su proveedor vigente, el último precio aprobado y todos los comparativos donde aparece.</div>`; return; }
    out.innerHTML = '<div class="loading">Buscando…</div>';
    const rs = await API.buscarProductos(txt);
    const exacta = rs.find(p => String(p.clave) === txt);
    if (exacta) return ficha(out, exacta);
    if (/^\d+$/.test(txt) && !rs.length) { // clave sin catálogo: puede tener historial
      return ficha(out, {clave:+txt, descripcion:'(clave no encontrada en el catálogo)'});
    }
    if (rs.length === 1) return ficha(out, rs[0]);
    out.innerHTML = rs.length ? `<div class="tbl-wrap"><table><thead><tr><th>Clave</th><th>Descripción</th><th>Marca</th><th>Comprador</th><th>Estatus compra</th></tr></thead><tbody>
      ${rs.map(p => `<tr class="click" data-p="${p.clave}"><td class="mono">${p.clave}</td><td>${esc(p.descripcion)}</td><td class="small">${esc(p.marca||'')}</td><td class="small">${esc(p.comprador||'')}</td><td class="small">${esc(p.estatus_compra||'')}</td></tr>`).join('')}
      </tbody></table></div>${rs.length === 60 ? '<p class="small muted">Se muestran los primeros 60 resultados. Escribe más palabras para afinar.</p>' : ''}` : `<div class="note">Sin resultados para “${esc(txt)}”.</div>`;
    $$('[data-p]', out).forEach(r => r.onclick = () => { $('#cq').value = r.dataset.p; ficha(out, rs.find(p => String(p.clave) === r.dataset.p)); });
  };
  $('#cf').onsubmit = (e) => { e.preventDefault(); buscar($('#cq').value).catch(err => toast(errMsg(err), true)); };
  $('#cq').value = q || ''; await buscar(q);
}

      <button class="btn pri" id="f-nuevo">Nuevo comparativo con esta clave</button>

async function cargarRefs(claves){

/* Bloqueo activo del proveedor para la clave: por clave, para todas, o proveedor SUSPENDIDO */
function bloqueoDe(provId, clave){
  const b = (E().bloq || []).find(x => x.proveedor_id === +provId && (x.clave == null || +x.clave === +clave));
  if (b) return b;
  const p = provPorId(provId); if (p && p.estatus === 'SUSPENDIDO') return {motivo:'Proveedor suspendido', clave:null};
  return null;
}
const bloqueoGlobal = (provId) => (E() && E().bloq || []).find(x => x.proveedor_id === +provId && x.clave == null) || ((provPorId(provId)||{}).estatus === 'SUSPENDIDO' ? {motivo:'Proveedor suspendido'} : null);
const relDe = (provId, clave) => (E().rel.get(+clave) || []).find(r => r.proveedor_id === +provId);
/* Proveedores con historial (comprado / cotizado) que faltan en el comparativo: se agregan solos */
function sugerirProveedores(claves){
  const c = E().c; if (!editable()) return [];
  const usados = new Set(c.proveedores.map(p => +p.id)); const nuevos = [];
  const rels = claves.flatMap(k => (E().rel.get(+k) || []).filter(r => !bloqueoDe(r.proveedor_id, k)));
  rels.sort((a, b) => (a.tipo === 'COMPRADO' ? 0 : 1) - (b.tipo === 'COMPRADO' ? 0 : 1) || (b.importe || 0) - (a.importe || 0));
  rels.forEach(r => {
    if (usados.has(+r.proveedor_id)) return; const p = provPorId(r.proveedor_id); if (!p) return;
    usados.add(p.id); nuevos.push(p.nombre);
    c.proveedores.push({id:p.id, nombre:p.nombre, descuentos:p.descuentos || '', factor:'', flete:'', entrega_tipo:'', entrega:p.tiempo_entrega || '', condiciones:p.condiciones_pago || '', con_clave:false});
  });
  // clave del proveedor conocida
  c.lineas.forEach(l => (E().rel.get(+l.clave) || []).forEach(r => { if (!r.clave_proveedor || !c.proveedores.some(p => +p.id === r.proveedor_id)) return;
    l.precios = l.precios || {}; const pr = l.precios[r.proveedor_id] = l.precios[r.proveedor_id] || {};
    if (!pr.clave_prov) { pr.clave_prov = r.clave_proveedor; const p = c.proveedores.find(x => +x.id === r.proveedor_id); if (p) p.con_clave = true; } }));

}

/* Precio que se compara: precio capturado × descuentos × factor (sin flete) y "puesto" (+ % de flete) */
function calcLinea(i){
  const c = E().c, l = c.lineas[i];
  l.precios = l.precios || {};
  // Último precio: el aprobado vigente; si no hay, el de la última compra del sistema
  if (l.ultimo_precio === undefined) {
    const v = vigDe(l);
    if (v && num(v.precio) !== null) { l.ultimo_precio = +v.precio; l.ultimo_origen = 'aprobado'; }
    else { l.ultimo_precio = num(l.u_compra) ?? num(l.u_costo); l.ultimo_origen = l.ultimo_precio !== null ? 'compra' : ''; }
  }
  const ult = num(l.ultimo_precio);
  let best = null; l._dif = {};
  c.proveedores.forEach(p => {
    const pr = l.precios[p.id]; if (!pr) return;
    if (bloqueoDe(p.id, l.clave)) { pr.sinflete = null; pr.neto = null; return; }
    pr.sinflete = netoDe(pr.precio, p.descuentos, p.factor);
    pr.neto = pr.sinflete === null ? null : Math.round(pr.sinflete * (1 + (num(p.flete) || 0) / 100) * 1e6) / 1e6;
    l._dif[p.id] = pct(pr.sinflete, ult);
    if (pr.neto !== null && (best === null || pr.neto < l.precios[best].neto)) best = String(p.id);
  });
  l._best = best;
  if (!l.manual) l.elegido = best;
  if (l.elegido && !(l.precios[l.elegido] && l.precios[l.elegido].neto !== null)) l.elegido = l.manual ? null : best;
  const neto = l.elegido ? l.precios[l.elegido].neto : null;
  const q = num(l.cantidad);
  l._neto = neto;
  l._min = best ? l.precios[best].neto : null;
  l._vsUlt = pct(neto, ult);
  l._crec = pct(num(l.pron), num(l.antec));
  l._impacto = (neto !== null && ult !== null && q !== null) ? (neto - ult) * q : null;
}
function vigDe(l){ // en aprobados se muestra lo que estaba vigente al crear el comparativo
  if (l.vigente && (E().c.estatus === 'APROBADO' || !E().vig.has(+l.clave))) return l.vigente;
  const v = E().vig.get(+l.clave); return v ? {proveedor:v.proveedor, precio:v.precio, fecha:v.aprobado_en, folio:v.folio} : (l.vigente || null);
}
function totales(){
  const ls = E().c.lineas; let act = 0, prop = 0, inv = 0; const porProv = {};
  ls.forEach(l => {
    const q = num(l.cantidad) || 0, ult = num(l.ultimo_precio);
    inv += num(l.inversion) || 0;
    if (l._neto !== null && l._neto !== undefined) {
      prop += l._neto * q; if (ult !== null) act += ult * q;
      const p = porProv[l.elegido] = porProv[l.elegido] || {n:0, imp:0}; p.n++; p.imp += l._neto * q;
    }
  });
  return {act, prop, impacto:prop - act, pctAum: act ? prop / act - 1 : null, inv, porProv, n:ls.length};
}

/* Congela encabezados (arriba) y columnas hasta "Último precio" (izquierda), como en Excel */
function congelar(){
  const t = $('#e-grid table.cmp-grid'); if (!t) return;
  const h1 = t.tHead.rows[0], h2 = t.tHead.rows[1];
  const nFz = [...h1.cells].findIndex(th => th.hasAttribute('data-ult')) + 1;
  // en pantallas angostas solo se congela la clave
  const n = window.innerWidth < 900 ? 1 : nFz;
  const lefts = []; let x = 0;
  [...h1.cells].slice(0, nFz).forEach((th, j) => { lefts[j] = x; x += th.getBoundingClientRect().width; });
  const marca = (cell, j) => { cell.classList.remove('fz', 'fz-last'); cell.style.left = '';
    if (j < n) { cell.classList.add('fz'); cell.style.left = lefts[j] + 'px'; if (j === n - 1) cell.classList.add('fz-last'); } };
  [...h1.cells].forEach((th, j) => { if (j < nFz) marca(th, j); });
  [...t.tBodies[0].rows].forEach(tr => [...tr.cells].forEach((td, j) => { if (j < nFz) marca(td, j); }));
  if (h2) { const top = h1.getBoundingClientRect().height; [...h2.cells].forEach(th => th.style.top = top + 'px'); }
}
window.addEventListener('resize', () => { if (S.view === 'editor') congelar(); });
/* Al moverse dentro de la tabla, la página se acomoda para que los encabezados no queden bajo la barra superior */
function alinearGrid(e){
  const g = $('#e-grid'), barra = $('.top'); if (!g || !barra) return;
  const limite = barra.getBoundingClientRect().bottom + 6, r = g.getBoundingClientRect();
  if (r.top >= limite - 1) return;
  if (e && e.type === 'wheel') {
    const alFinal = g.scrollTop + g.clientHeight >= g.scrollHeight - 2;
    if (e.deltaY > 0 && alFinal) return;   // ya terminó la tabla: deja seguir la página hacia abajo
  }
  window.scrollBy(0, r.top - limite);
}

async function agregarClaves(claves, repintar=true){
  const c = E().c; const ya = new Set(c.lineas.map(l => String(l.clave)));
  const nuevas = [...new Set(claves.map(String))].filter(k => !ya.has(k));
  const rep = claves.length - nuevas.length;
  if (!nuevas.length) { toast('Esas claves ya están en el comparativo'); return; }
  await cargarRefs(nuevas.map(Number));
  const sinCat = [];
  nuevas.forEach(k => {
    const p = E().prod.get(+k) || {}; const v = E().vig.get(+k);
    if (!p.clave) sinCat.push(k);
    c.lineas.push({clave:+k, descripcion:p.descripcion || '', cantidad:null, clasificacion:'', inversion:null, pron:null, antec:null,
      u_costo:p.u_costo ?? null, u_compra:p.u_compra ?? null, f_u_compra:p.f_u_compra || null, base:p.precio_base ?? null,
      vigente: v ? {proveedor:v.proveedor, precio:v.precio, fecha:v.aprobado_en, folio:v.folio} : null, precios:{}, elegido:null, manual:false, motivo:''});
    calcLinea(c.lineas.length - 1);
  });
  marcarCambio();
  const nuevosProv = sugerirProveedores(nuevas);
  if (nuevosProv.length) c.lineas.forEach((l, i) => calcLinea(i));
  if (nuevosProv.length && repintar) pintarProvs();
  if (sinCat.length) toast(`No están en el catálogo: ${sinCat.join(', ')}. Revisa que la clave sea correcta.`, true);
  else if (rep) toast(`${rep} clave(s) ya estaban en el comparativo`);
  if (repintar) { pintarGrid(); pintarSum(); pintarAcciones(); }
}

/* Mismo acomodo que la "Comparativa de precios": ID … ÚLTIMO PRECIO | proveedor, DIF VS ULTM $, + % FLETE | COSTO MÍNIMO | DIF VS ULT. COSTO | PROVEEDOR */
function exportarComparativo(){
  const c = E().c, P = c.proveedores, dem = verDemanda();
  const head = ['ID','DESCRIPCION','CANTIDAD', ...(dem ? ['CLASIFICACION','INVERSIÓN','PRON','ANTEC','CRECIMIENTO'] : []), 'ULTIMO PRECIO'];

  head.push('MEJOR PRECIO'); head.push('MOTIVO');
  monCols.add(head.push('IMPORTE ASIGNADO') - 1); monCols.add(head.push('IMPACTO $') - 1);

    const r = [l.clave, l.descripcion, l.cantidad, ...(dem ? [l.clasificacion || '', l.inversion ?? null, l.pron ?? null, l.antec ?? null, l._crec] : []), l.ultimo_precio ?? null];
    P.forEach(p => { const x = pr[p.id] || {};

      r.push(x.sinflete ?? x.precio ?? null); r.push((l._dif || {})[p.id] ?? null);
      if (num(p.flete)) r.push(x.neto ?? null); });
    const nom = (id) => (P.find(p => String(p.id) === String(id)) || {}).nombre || '';
    r.push(l._neto, l._vsUlt, l.elegido ? nom(l.elegido) : 'NO ASIGNAR', l._best ? nom(l._best) : '', l.motivo || '',
      l._neto != null && num(l.cantidad) != null ? l._neto * l.cantidad : null, l._impacto);
    return r; });
  const ent = new Array(head.length).fill(null); let col = 3 + (dem ? 5 : 0) + 1;
  P.forEach(p => { col += p.con_clave ? 1 : 0; ent[col] = p.entrega_tipo || ''; col += 2 + (num(p.flete) ? 1 : 0); });
  const t = totales();
  const info = [[`COMPARATIVO ${c.folio || '(sin guardar)'} · ${c.titulo}`], [`Comprador: ${c.comprador}`, null, `Estatus: ${c.estatus}`, null, c.aprobado_por ? `${c.estatus === 'APROBADO' ? 'Aprobado' : 'Revisado'} por ${c.aprobado_por} · ${fmtFH(c.aprobado_en)}` : null],
    [`Importe a último precio: ${fmtImp(t.act)}`, null, `Importe asignado: ${fmtImp(t.prop)}`, null, `% aumento ponderado: ${t.pctAum === null ? '—' : (t.pctAum*100).toFixed(2) + '%'}`], []];
  const aoa = [...info, head, ...rows, [], ent];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const r0 = info.length + 1;
  for (let r = r0; r < r0 + rows.length; r++) for (let j = 0; j < head.length; j++) {
    const cell = ws[XLSX.utils.encode_cell({r, c:j})]; if (!cell || cell.t !== 'n') continue;
    if (pctCols.has(j)) cell.z = '0.0%'; else if (monCols.has(j)) cell.z = '"$"#,##0.00';
  }
  ws['!cols'] = head.map((h, i) => ({wch: i === 1 ? 52 : Math.max(9, Math.min(22, String(h).length + 2))}));
  ws['!autofilter'] = {ref: XLSX.utils.encode_range({s:{r:info.length, c:0}, e:{r:info.length + rows.length, c:head.length - 1}})};
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'COMPARATIVO');
  descargarXlsx(wb, `${c.folio || 'comparativo'} ${c.titulo}`.replace(/[\\/:*?"<>|]/g, '').slice(0, 80) + '.xlsx');
}

/* ====================================================================
   IMPORTADOR DE EXCEL (comparativos y catálogo)

const normH = (h) => String(h ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9/]/g, '');
function leerExcel(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { try { res(XLSX.read(new Uint8Array(r.result), {type:'array', cellDates:true})); } catch(e) { rej(new Error('No se pudo leer el archivo. ¿Es un Excel (.xlsx / .xls / .csv)?')); } };
    r.onerror = () => rej(new Error('No se pudo leer el archivo'));
    r.readAsArrayBuffer(file);
  });
}
const aFecha = (v) => { if (!v) return null; if (v instanceof Date) return isNaN(v) ? null : v.toISOString().slice(0,10);
  const s = String(v).trim(); let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return null; };
const r2 = (v) => v === null ? null : Math.round(v * 100) / 100;
const aNum = (v) => { if (v === null || v === undefined || v === '') return null; if (typeof v === 'number') return v; const n = parseFloat(String(v).replace(/[$,\s]/g, '')); return isNaN(n) ? null : n; };

const ROLES_CMP = [['','Ignorar'],['clave','ID / Clave'],['descripcion','Descripción'],['cantidad','Cantidad'],['clasificacion','Clasificación'],['inversion','Inversión'],['pron','Pron'],['antec','Antec'],['ultimo_precio','Último precio'],['u_costo','U/costo'],['f_u_compra','F/U/compra (fecha)'],['u_compra','U/compra'],['base','Precio base'],['precio','Precio de proveedor →'],['clave_prov','Clave del proveedor →']];
function adivinaCmp(h, vals, vistos){
  const n = normH(h);
  if (!n) return {rol:''};
  if (['id','clave','sku','codigo','cve'].includes(n)) return {rol:'clave'};
  if (n.startsWith('descrip')) return {rol:'descripcion'};
  if (n.startsWith('cant')) return {rol:'cantidad'};
  if (n.startsWith('clasif')) return {rol:'clasificacion'};
  if (n.startsWith('inversi')) return {rol:'inversion'};
  if (n === 'pron' || n.startsWith('pronost')) return {rol:'pron'};
  if (n === 'antec' || n.startsWith('anteced')) return {rol:'antec'};
  if (n.startsWith('ultimoprecio') || n === 'ultprecio') return {rol:'ultimo_precio'};
  if (/flete|dif|crecim|minimo|asignad/.test(n)) return {rol:''};
  if (n.startsWith('f/u') || n.includes('fecha')) return {rol:'f_u_compra'};
  if (['u/costo','ucosto','ultimocosto','costo'].includes(n)) return {rol:'u_costo'};
  if (['u/compra','ucompra','ultimacompra'].includes(n)) return {rol:'u_compra'};
  if (['base','preciobase'].includes(n)) return {rol:'base'};
  if (/vs|mejor|margen|proveedor|total|importe|ahorro|diferencia/.test(n)) return {rol:''};
  const todos = vals.filter(v => v !== null && v !== '').map(aNum), nums = todos.filter(x => x !== null);
  if (!nums.length || nums.length < todos.length * 0.8) return {rol:''};  // admite notas al pie como "ENTREGA DIRECTA"
  const nombre = String(h).trim().toUpperCase();
  if (nums.every(x => Number.isInteger(x) && x >= 1000)) return {rol:'clave_prov', prov:nombre};
  return {rol:'precio', prov:nombre};
}

    cols.filter(c => c.rol === 'clave_prov').forEach(c => { const v = (r||[])[c.j]; if (v !== null && v !== '' && provs.some(p => p.nombre === c.prov)) { const id = idDe(c.prov); precios[id] = precios[id] || {}; precios[id].clave_prov = String(v); } });

      clasificacion:get(r,'clasificacion') ? String(get(r,'clasificacion')).trim().toUpperCase() : '', inversion:r2(aNum(get(r,'inversion'))), pron:r2(aNum(get(r,'pron'))), antec:r2(aNum(get(r,'antec'))),

      u_compra:aNum(get(r,'u_compra')), f_u_compra:aFecha(get(r,'f_u_compra')), base:aNum(get(r,'base')), precios, elegido:null, manual:false, motivo:''});
  });
  if (!lineas.length) throw new Error('No encontré filas con clave numérica');
  // completa con el catálogo lo que no traiga el archivo
  const ps = await API.productos(lineas.map(l => l.clave)); const pm = new Map(ps.map(p => [+p.clave, p]));
  const vs = await API.vigentes(lineas.map(l => l.clave)); const vm = new Map(vs.map(v => [+v.clave, v]));
  lineas.forEach(l => { const p = pm.get(l.clave) || {}; const v = vm.get(l.clave);
    if (!l.descripcion) l.descripcion = p.descripcion || ''; if (l.u_costo === null) l.u_costo = p.u_costo ?? null; if (l.u_compra === null) l.u_compra = p.u_compra ?? null;
    if (!l.f_u_compra) l.f_u_compra = p.f_u_compra || null; if (l.base === null) l.base = p.precio_base ?? null;

  const c = {...nuevoComparativo(), titulo, proveedores:provs, lineas, notas:`Importado de Excel (${el._nombre}).`};
  if (Object.keys(fletes).length || Object.keys(entregas).length) c.notas += ` Flete y tipo de entrega tomados del archivo.`;
  const comp = [...new Set(lineas.map(l => (pm.get(l.clave)||{}).comprador).filter(Boolean))];
  if (comp.length === 1 && S.usuarios.some(u => u.nombre === comp[0])) c.comprador = comp[0];
  setTimeout(() => { go('editor', {importado:c}).then(() => toast(`${lineas.length} claves importadas${faltan.length ? ` · proveedores nuevos: ${faltan.join(', ')}` : ''}. Revisa y guarda.`)); }, 0);
}

/* Carga del archivo de proveedores por clave (comprados y solo cotizados) */
const CAMPOS_REL = [['','Ignorar'],['clave','Clave'],['proveedor','Proveedor'],['id_prov','ID del proveedor (sistema)'],['tipo','Tipo (compra / cotización)'],['fecha','Fecha'],['precio','Precio'],['clave_prov','Clave del proveedor']];
function adivinaRel(h){
  const n = normH(h);
  if (['clave','id','sku','codigo','articulo','cve'].includes(n)) return 'clave';
  if (['idproveedor','idprov','numproveedor','noproveedor','cveproveedor'].includes(n)) return 'id_prov';
  if (n.startsWith('proveedor') || n === 'prov' || n.startsWith('razonsocial') || n === 'nombreproveedor') return 'proveedor';
  if (n.startsWith('tipo') || n.startsWith('movimiento') || n.startsWith('origen')) return 'tipo';
  if (n.includes('fecha') || n.startsWith('ultimacompra')) return 'fecha';
  if (n.startsWith('precio') || n.startsWith('costo') || n.startsWith('ultimoprecio')) return 'precio';
  if (n.includes('claveprod') || n.includes('claveprov') || n.includes('codigoprov') || n.includes('skuprov')) return 'clave_prov';
  return '';
}
/* Junta filas repetidas clave + proveedor: COMPRADO gana; fecha y precio más recientes */
function consolidarRel(filas){
  const m = new Map();
  filas.forEach(f => {
    const k = f.clave + '|' + (f.id_prov != null ? 'id' + f.id_prov : f.proveedor), x = m.get(k);
    if (!x) { m.set(k, {...f}); return; }
    if (f.tipo === 'COMPRADO') { x.tipo = 'COMPRADO'; ['recepciones','importe','primera_fecha'].forEach(c => { if (f[c] != null) x[c] = f[c]; }); }
    if (f.fecha && (!x.fecha || f.fecha >= x.fecha)) { x.fecha = f.fecha; if (f.precio != null) x.precio = f.precio; }
    if (f.clave_prov) x.clave_prov = f.clave_prov;
    if (!x.proveedor && f.proveedor) x.proveedor = f.proveedor;
  });
  return [...m.values()];
}
/* Formato "Proveedores por clave — COMPRADOR" (hojas Base Proveedores, Detalle Clave-Proveedor, Catálogo Proveedores) */
function esFormatoComprador(wb){ return wb.SheetNames.some(n => normH(n) === 'baseproveedores'); }
function leerFormatoComprador(wb, archivo){
  const hoja = (nombre) => { const n = wb.SheetNames.find(x => normH(x) === nombre); return n ? XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:null, blankrows:false}) : null; };
  const esClave = (v) => /^\d+$/.test(String(v ?? '').trim());
  const cat = new Map();
  (hoja('catalogoproveedores') || []).slice(1).forEach(r => { if (r && r[1] && esClave(r[0])) cat.set(String(r[1]).trim().toUpperCase(), +r[0]); });
  const base = hoja('baseproveedores');
  const hr = base.findIndex(r => normH((r||[])[0]) === 'clave');
  if (hr < 0) throw new Error(`${archivo}: no encontré el encabezado CLAVE en la hoja Base Proveedores`);
  const H = base[hr].map(normH), col = (f) => H.findIndex(f);
  const cComp = col(h => h === 'comprador'), cDesc = col(h => h.startsWith('descrip')), cObs = col(h => h.startsWith('observaciones'));
  const cots = H.map((h, j) => h.startsWith('cotizado') && /\d/.test(h) ? j : -1).filter(j => j >= 0);
  const provs = H.map((h, j) => /^proveedor\d+$/.test(h) ? j : -1).filter(j => j >= 0);
  const filas = [], claves = [], obs = []; const compradores = new Set(); let nCot = 0, nComp = 0;
  base.slice(hr + 1).forEach(r => { r = r || []; if (!esClave(r[0])) return;
    const clave = String(r[0]).trim(); claves.push(+clave);
    if (cComp >= 0 && r[cComp]) compradores.add(String(r[cComp]).trim().toUpperCase());
    if (cObs >= 0 && r[cObs] != null && String(r[cObs]).trim()) obs.push({clave:+clave, descripcion:cDesc >= 0 ? r[cDesc] : '', texto:String(r[cObs]).trim()});
    cots.forEach(j => { const nom = r[j] == null ? '' : String(r[j]).trim(); if (!nom) return;
      const idc = normH(H[j + 1]).startsWith('idcot') && esClave(r[j + 1]) ? +r[j + 1] : (cat.get(nom.toUpperCase()) ?? null);
      filas.push({clave, id_prov:idc, proveedor:nom.toUpperCase(), tipo:'COTIZADO'}); nCot++; });
  });
  const det = hoja('detalleclaveproveedor');
  if (det && det.length > 1) {
    const D = det[0].map(normH), dc = (f) => D.findIndex(f);
    const iC = dc(h => h === 'clave'), iId = dc(h => h === 'idproveedor'), iP = dc(h => h === 'proveedor'), iR = dc(h => h.includes('recepciones')),
          iI = dc(h => h.startsWith('importe')), iF1 = dc(h => h.startsWith('primeracompra')), iF2 = dc(h => h.startsWith('ultimacompra')), iCP = dc(h => h.startsWith('claveprod'));
    det.slice(1).forEach(r => { r = r || []; if (!esClave(r[iC])) return;
      filas.push({clave:String(r[iC]).trim(), id_prov:esClave(r[iId]) ? +r[iId] : null, proveedor:r[iP] ? String(r[iP]).trim().toUpperCase() : '', tipo:'COMPRADO',
        fecha:iF2 >= 0 ? aFecha(r[iF2]) : null, primera_fecha:iF1 >= 0 ? aFecha(r[iF1]) : null, recepciones:iR >= 0 ? aNum(r[iR]) : null,
        importe:iI >= 0 ? aNum(r[iI]) : null, clave_prov:iCP >= 0 && r[iCP] != null ? String(r[iCP]).trim() : null}); nComp++; });
  } else {
    base.slice(hr + 1).forEach(r => { r = r || []; if (!esClave(r[0])) return;
      provs.forEach(j => { const nom = r[j] == null ? '' : String(r[j]).trim(); if (!nom || /SIN COMPRAS/i.test(nom)) return;
        const id = normH(H[j - 1]).startsWith('idprov') && esClave(r[j - 1]) ? +r[j - 1] : (cat.get(nom.toUpperCase()) ?? null);
        filas.push({clave:String(r[0]).trim(), id_prov:id, proveedor:nom.toUpperCase(), tipo:'COMPRADO'}); nComp++; }); });
  }
  return {archivo, compradores:[...compradores], claves, filas, obs, nComp, nCot};
}

  bindClaveLinks(ab); bindBloqueos(ab, () => admBloqueos(ab));
}
function admPin(ab){
  ab.innerHTML = `<form class="panel stack" id="pf" style="max-width:380px">
    <div class="field"><label for="p1">PIN actual</label><input id="p1" type="password" inputmode="numeric"></div>
    <div class="field"><label for="p2">PIN nuevo (mínimo 4 dígitos)</label><input id="p2" type="password" inputmode="numeric" autocomplete="new-password"></div>
    <div class="field"><label for="p3">Repite el PIN nuevo</label><input id="p3" type="password" inputmode="numeric" autocomplete="new-password"></div>
    <div class="err-msg" id="pe"></div><button class="btn pri">Cambiar PIN</button></form>`;
  $('#pf').onsubmit = async (e) => { e.preventDefault(); $('#pe').textContent = '';
    if ($('#p2').value !== $('#p3').value) { $('#pe').textContent = 'El PIN nuevo no coincide'; return; }
    try { await API.cambiarPin(S.user.id, $('#p1').value, $('#p2').value); toast('PIN actualizado'); $('#pf').reset(); } catch(err) { $('#pe').textContent = errMsg(err); } };
}

(async function boot(){
  const u = store.get('cmp_user');
  if (u) { try { const us = await API.usuarios(); const x = us.find(y => y.id === u.id && y.activo); if (x) { S.user = x; return start(); } } catch(e) {} }
  login();
})();

</script>
